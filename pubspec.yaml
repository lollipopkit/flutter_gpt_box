name: gpt_box
description: "A third-party GPT Client for OpenAI API."
publish_to: 'none'
version: 1.0.397+397

environment:
  sdk: ">=3.11.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  app_links: ^7.0.0
  file_picker: ^12.3.0
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  icons_plus:
    git:
      url: https://github.com/lollipopkit/icons_plus
      ref: main
  html: ^0.15.7
  image_picker: ^1.2.0
  logging: ^1.3.0
  markdown: ^7.3.0
  screenshot: ^3.0.0
  shortid: ^0.1.2
  # Direct, though `SqliteStore` lives in fl_lib: `hooks.user_defines` below is
  # only honoured for this package's own dependencies.
  sqlite3: ^3.6.0
  webdav_client_plus: ^2.0.0
  # TODO: a git dependency once lollipopkit/fl_pi_llm is published.
  fl_pi_llm:
    path: ../fl_pi_llm
  mcp_dart:
    git:
      url: https://github.com/leehack/mcp_dart
      ref: main
  fl_lib:
    path: packages/fl_lib
  animations: ^3.0.0

dependency_overrides:
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  fl_build:
    git:
      url: https://github.com/lppcg/fl_build.git
      ref: 0449e5e66d9631fb6ced8c4d080d51648327887b

# Which SQLite gets compiled into the app. Only the root package can set this.
# `SqliteDb` keys the database with `PRAGMA key`, which needs SQLite3MultipleCiphers.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

fl_build:
  appName: GPTBox
