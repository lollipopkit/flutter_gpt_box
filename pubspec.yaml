name: gpt_box
description: "A third-party GPT Client for OpenAI API."
publish_to: 'none'
version: 1.0.397+397

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  app_links: ^7.0.0
  icons_plus:
    git:
      url: https://github.com/lollipopkit/icons_plus
      ref: main
  logging: ^1.3.0
  screenshot: ^3.0.0
  # Direct, though `SqliteStore` lives in fl_lib: `hooks.user_defines` below is
  # only honoured for this package's own dependencies.
  sqlite3: ^3.6.0
  webdav_client_plus: ^2.0.0
  # A submodule, like fl_lib: developed alongside. Its ui package has the
  # chats, tools and provider settings, shared with Server Box.
  fl_pi_llm:
    path: packages/fl_pi_llm
  fl_pi_llm_ui:
    path: packages/fl_pi_llm/ui
  fl_lib:
    path: packages/fl_lib
  animations: ^3.0.0
  material_ui: ^1.5.0

dependency_overrides:
  # fl_pi_llm_ui asks for fl_lib from git; the submodule is the one.
  fl_lib:
    path: packages/fl_lib
  # For flutter_markdown_plus_latex, in fl_pi_llm_ui: only the root can override.
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  fl_build:
    git:
      url: https://github.com/lppcg/fl_build.git
      ref: 0449e5e66d9631fb6ced8c4d080d51648327887b

# Which SQLite gets compiled into the app. Only the root package can set this.
# `SqliteDb` keys the database with `PRAGMA key`, which needs SQLite3MultipleCiphers.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

fl_build:
  appName: GPTBox
