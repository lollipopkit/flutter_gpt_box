plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.lollipopkit.llmbox"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.lollipopkit.llmbox"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // The release key: android/app/llmbox.p12 (EC P-384, PKCS12, one
    // password for store and key). Its password comes from the environment
    // (ANDROID_KEYSTORE_PASSWORD, locally read from the keychain item
    // "llmbox-android-keystore"), or from key.properties in CI; never from a
    // file in the repository.
    signingConfigs {
        release {
            def password = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias'] ?: 'llmbox'
            keyPassword keystoreProperties['keyPassword'] ?: password
            storeFile file(keystoreProperties['storeFile'] ?: 'llmbox.p12')
            storePassword password
        }
    }

    packaging {
        jniLibs {
            // Extracted rather than mapped out of the APK: proot (fl_tty, for
            // the shell tool) is executed as a file, and only the extracted
            // native library directory may be executed from.
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            resValue "string", "app_name", "LLMBoxD"
        }

        profile {
            resValue "string", "app_name", "LLMBoxP"
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
